<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surat Akuan dan Kebenaran</title>
<link rel="icon" href="semsira.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--ink:#12263f;--mut:#5d6b7e;--line:#dbe1ea;--bg:#eef1f5;--pri:#12315c;--acc:#0d7a5f;--gold:#b58a2f;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--pri);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
.hd{max-width:820px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.hd b{font-size:14px;line-height:1.2;display:block}.hd small{opacity:.8;font-size:12px}
.lang{margin-left:auto;display:flex;border:1px solid #ffffff55;border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:#fff;color:var(--pri);font-weight:600}
main{max-width:820px;margin:auto;padding:20px 12px 60px;display:grid;gap:18px}
svg.lucide{width:18px;height:18px;flex:none}
.paper{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:4px;padding:28px clamp(16px,5vw,48px);font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.75;text-align:justify}
.sch{display:flex;gap:14px;align-items:center;justify-content:center;text-align:center;margin-bottom:14px}
.sch img{width:64px}.sch div{font-weight:700;font-size:15px;line-height:1.35}
.paper h1{font-size:17px;text-align:center;margin:14px 0 18px;text-decoration:underline;text-underline-offset:4px}
.paper p{margin:0 0 12px}
.bl{display:inline-block;min-width:90px;border-bottom:1px dotted #333;font-weight:700;padding:0 4px;text-align:left;font-family:"Public Sans",sans-serif;font-size:14px}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;font-size:15px;text-align:left}
.ft img{max-width:180px;max-height:80px;display:block}
.ft .psig{max-width:180px;max-height:80px;display:block;border-bottom:1px dotted #333;min-height:50px}
.sg{display:flex;align-items:center;gap:6px;color:var(--acc);font-weight:600;font-family:"Public Sans",sans-serif;font-size:14px}
.form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px}
.form h2{margin:0;font-size:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;font-weight:600;display:grid;gap:4px}
input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.opt label{display:flex;grid:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:500;cursor:pointer;flex:1;min-width:160px}
.opt input{width:auto}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;background:#f4f8f6;border:1px solid #cfe5dc;padding:12px;border-radius:8px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;background:var(--acc);color:#fff;padding:13px 18px;border-radius:8px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}.btn:focus-visible{outline:3px solid #7fc4b0;outline-offset:2px}
.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ib:hover{background:var(--bg)}
.msg{text-align:center;padding:50px 20px;background:#fff;border:1px solid var(--line);border-radius:10px}
.msg svg{width:52px;height:52px;color:var(--acc)}.msg.e svg{color:var(--red)}
#err{color:var(--red);font-size:13px;min-height:1em}
canvas{width:100%;height:auto;border:1px dashed #8a97a8;border-radius:8px;touch-action:none;background:#fff;cursor:crosshair}
.sigwrap{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px;background:#f8fafc}
.sigwrap b{font-size:13px}
.sigwrap small{color:var(--mut);font-size:12px}
.legal{margin:0;font-size:12.5px;line-height:1.6;color:var(--mut);background:#fff7e6;border:1px solid #f0d9a8;border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;text-align:justify}
@media(max-width:560px){.row,.ft{grid-template-columns:1fr}.paper{font-size:15px;text-align:left}}
@media print{header,.form{display:none}}
</style>
</head>
<body>
<header><div class="hd">
<img src="semsira.png" alt="SEMSIRA" onerror="this.style.display='none'">
<div><b>SMK Syed Sirajuddin Jejawi</b><small>02600 Arau, Perlis</small></div>
<div class="lang" id="lang"><button data-l="ms">BM</button><button data-l="en">EN</button></div>
</div></header>
<main id="app"></main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,doc,getDoc,addDoc,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyDJbWYrVvM-ozMPvKRg4SzHnEP4Ihuor28",authDomain:"semsira-sk.firebaseapp.com",projectId:"semsira-sk",storageBucket:"semsira-sk.firebasestorage.app",messagingSenderId:"429615120997",appId:"1:429615120997:web:b7c5e4f0f0c6b85086fc8c"}));
const CLASSES=["SUMAYYAH","SARAH","KHADIJAH","FATIMAH","ZAINAB","RUQAYYAH","UMMU KALTHOM","AISHAH","AL FARABI","AL GHAZALI","AL KINDI","AL MAWARDI","AL RAZI","IBNU KHALDUN","IBNU RUSH","IBNU SINA"];
const D={
ms:{h:"SURAT AKUAN DAN KEBENARAN IBU BAPA / PENJAGA",sch:["Sekolah Menengah Kebangsaan Syed Sirajuddin Jejawi","02600, Arau, Perlis"],
p1:v=>`Adalah saya ${v.parent} ibu bapa / penjaga kepada, Nombor Kad Pengenalan ${v.icP}, anak yang bernama ${v.student} Tingkatan : ${v.kelas}, Nombor Kad Pengenalan / Surat Lahir ${v.icS} dengan ini memberi pengakuan bahawa saya membenarkan anak jagaan saya seperti di atas menyertai program <b>${v.program}</b> bertempat di <b>${v.lokasi}</b> yang akan diadakan pada <b>${v.tarikh}</b> anjuran <b>${v.anjuran}</b>.`,
p2:v=>`Saya juga ${v.veh} anak jagaan saya menaiki kenderaan guru / bas semasa pergi dan pulang dari menghadiri program yang berkenaan sekiranya berkeperluan.`,vy:"membenarkan",vn:"tidak membenarkan",vq:"* membenarkan / tidak membenarkan",
p3:"Saya sedar tentang risiko yang dihadapi dan faham bahawa pihak Kementerian Pendidikan Malaysia / Jabatan Pendidikan Negeri / Sekolah akan mengambil tindakan yang perlu dan wajar bagi memastikan keselamatan pelajar-pelajar semasa mengikuti program ini.",
p4:"Saya akan menasihati dan mengingatkan anak jagaan saya supaya patuh kepada arahan yang diberi oleh pegawai-pegawai yang bertanggungjawab / Guru Pengiring bagi program ini.",
f1:"Tandatangan ibu bapa / penjaga",f2:"Nama",f3:"No. Telefon ibu bapa / penjaga",f4:"Tarikh",f5:"Tandatangan & Cop Pengetua",sd:"Telah ditandatangani",
ft:"Maklumat ibu bapa / penjaga",lp:"Nama ibu bapa / penjaga",li:"No. Kad Pengenalan ibu bapa / penjaga",ls:"Nama pelajar",lk:"Tingkatan / Kelas",lc:"Pilih kelas",lic:"No. Kad Pengenalan / Surat Lahir pelajar",lv:"Kenderaan guru / bas",lph:"No. Telefon",ld:"Tarikh",sg:"Saya telah menandatangani surat ini (tandatangan ibu bapa / penjaga)",send:"Hantar",sending:"Menghantar...",
ok:"Terima kasih",okt:"Surat kebenaran anda telah dihantar.",again:"Hantar untuk anak lain",nf:"Surat tidak dijumpai",nft:"Sila semak pautan atau hubungi pihak sekolah.",req:"Sila lengkapkan semua ruangan.",fail:"Gagal menghantar. Cuba lagi.",
sigT:"Tandatangan ibu bapa / penjaga (lukis di bawah)",sigClear:"Padam tandatangan",sigSaved:"Tandatangan disimpan sementara pada peranti ini (1 bulan).",sigNeed:"Sila lukis tandatangan ibu bapa / penjaga.",sigRestored:"Tandatangan terdahulu dipulihkan.",sigExpire:"Tandatangan sementara ini akan tamat pada",
sigLegal:"Dengan menandatangani secara elektronik di atas, saya mengesahkan bahawa tandatangan elektronik ini adalah sah dan mempunyai kesan undang-undang yang sama seperti tandatangan basah / fizikal saya, dan saya bersetuju dengan segala kandungan surat ini."},
en:{h:"PARENT / GUARDIAN DECLARATION AND CONSENT LETTER",sch:["Syed Sirajuddin Jejawi National Secondary School","02600, Arau, Perlis"],
p1:v=>`I, ${v.parent}, (IC No. ${v.icP}) parent / guardian of ${v.student}, Form: ${v.kelas}, IC No. / Birth Certificate No. ${v.icS}, hereby declare that I give permission for my ward named above to take part in the programme <b>${v.program}</b> held at <b>${v.lokasi}</b> on <b>${v.tarikh}</b>, organised by <b>${v.anjuran}</b>.`,
p2:v=>`I also ${v.veh} my ward to travel in a teacher's vehicle / bus to and from the programme where necessary.`,vy:"permit",vn:"do not permit",vq:"* permit / do not permit",
p3:"I am aware of the risks involved and understand that the Ministry of Education Malaysia / State Education Department / School will take the necessary and appropriate action to ensure the safety of students during this programme.",
p4:"I will advise and remind my ward to obey the instructions given by the responsible officers / accompanying teachers for this programme.",
f1:"Parent / guardian signature",f2:"Name",f3:"Parent / guardian phone no.",f4:"Date",f5:"Principal's signature & stamp",sd:"Signed",
ft:"Parent / guardian details",lp:"Parent / guardian name",li:"Parent / guardian IC no.",ls:"Student name",lk:"Form / Class",lc:"Select class",lic:"Student IC / Birth Certificate no.",lv:"Teacher's vehicle / bus",lph:"Phone no.",ld:"Date",sg:"I have signed this letter (parent / guardian signature)",send:"Submit",sending:"Submitting...",
ok:"Thank you",okt:"Your consent letter has been submitted.",again:"Submit for another child",nf:"Letter not found",nft:"Please check the link or contact the school.",req:"Please complete all fields.",fail:"Could not submit. Please try again.",
sigT:"Parent / guardian signature (draw below)",sigClear:"Clear signature",sigSaved:"Signature temporarily saved on this device (1 month).",sigNeed:"Please draw the parent / guardian signature.",sigRestored:"Previous signature restored.",sigExpire:"This temporary signature expires on",
sigLegal:"By signing electronically above, I confirm that this electronic signature is valid and carries the same legal effect as my wet / physical signature, and I agree to all the contents of this letter."}
};
let L=localStorage.getItem("lang")||"ms";if(!D[L])L="ms";
let letter=null,V={parent:"",icP:"",student:"",kelas:"",icS:"",phone:"",veh:null,signed:false,date:new Date().toISOString().slice(0,10)},state="load";
const id=new URLSearchParams(location.search).get("id"),$=s=>document.querySelector(s),t=k=>D[L][k];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bl=x=>`<span class="bl">${esc(x)||"&nbsp;"}</span>`;

/* ---------- 签名缓存（localStorage，1 个月过期，不上传 Firebase） ---------- */
const SIG_KEY="semsira_parent_signature";
const SIG_TTL_MS=30*24*60*60*1000; // 1 个月
function sigLoad(){
  try{
    const raw=localStorage.getItem(SIG_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||!o.data||!o.ts) return null;
    if(Date.now()-o.ts>SIG_TTL_MS){localStorage.removeItem(SIG_KEY);return null}
    return o;
  }catch{return null}
}
function sigSave(dataUrl){
  try{localStorage.setItem(SIG_KEY,JSON.stringify({data:dataUrl,ts:Date.now()}))}catch{}
}
function sigClear(){try{localStorage.removeItem(SIG_KEY)}catch{}}
function sigExpiryText(ts){try{return new Date(ts+SIG_TTL_MS).toLocaleDateString()}catch{return ""}}

function vals(){return{parent:bl(V.parent),icP:bl(V.icP),student:bl(V.student),kelas:bl(V.kelas),icS:bl(V.icS),program:esc(letter.program),lokasi:esc(letter.lokasi),tarikh:esc(letter.tarikh),anjuran:esc(letter.anjuran),veh:V.veh===null?t("vq"):V.veh?t("vy"):t("vn")}}

function paper(){
  const v=vals(),s=D[L].sch;
  const cached=sigLoad();
  const sigBlock=V.signed
    ? (cached?`<img src="${cached.data}" alt="${esc(t("f1"))}" style="max-width:180px;max-height:80px;display:block">`
              :`<div class="sg"><i data-lucide="check-circle-2"></i>${t("sd")}</div>`)
    : bl("");
  return`<section class="paper" id="paper"><div class="sch"><img src="semsira.png" alt="" onerror="this.style.display='none'"><div>${s[0]}<br>${s[1]}</div></div>
<h1>${t("h")}</h1><p>${t("p1")(v)}</p><p>${t("p2")(v)}</p><p>${t("p3")}</p><p>${t("p4")}</p>
<div class="ft"><div>${t("f1")} : ${sigBlock}<br>${t("f2")} : ${bl(V.parent)}<br>${t("f3")} : ${bl(V.phone)}<br>${t("f4")} : ${bl(V.date)}</div>
<div>${t("f5")} :<br><img src="${letter.signature}" alt=""></div></div></section>`}

function formHtml(){return`<form class="form" id="f" novalidate><h2>${t("ft")}</h2>
<label>${t("lp")}<input name="parent" autocomplete="name" value="${esc(V.parent)}" required></label>
<label>${t("li")}<input name="icP" inputmode="numeric" value="${esc(V.icP)}" required></label>
<div class="row"><label>${t("ls")}<input name="student" value="${esc(V.student)}" required></label>
<label>${t("lk")}<select name="kelas" required><option value="">${t("lc")}</option>${CLASSES.map(c=>`<option ${c==V.kelas?"selected":""}>${c}</option>`).join("")}</select></label></div>
<label>${t("lic")}<input name="icS" inputmode="numeric" value="${esc(V.icS)}" required></label>
<div><b style="font-size:13px">${t("lv")}</b><div class="opt"><label><input type="radio" name="veh" value="1" ${V.veh===true?"checked":""}>${t("vy")}</label><label><input type="radio" name="veh" value="0" ${V.veh===false?"checked":""}>${t("vn")}</label></div></div>
<div class="row"><label>${t("lph")}<input name="phone" type="tel" autocomplete="tel" value="${esc(V.phone)}" required></label>
<label>${t("ld")}<input name="date" type="date" value="${V.date}" required></label></div>
<div class="sigwrap">
  <b>${t("sigT")}</b>
  <canvas id="sig" width="600" height="200"></canvas>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button type="button" class="ib" id="sigClr"><i data-lucide="eraser"></i>${t("sigClear")}</button>
    <small id="sigHint">${t("sigSaved")}</small>
  </div>
</div>
<p class="legal">${t("sigLegal")}</p>
<label class="chk"><input type="checkbox" name="signed" ${V.signed?"checked":""}>${t("sg")}</label>
<div id="err"></div><button class="btn" id="go"><i data-lucide="send"></i>${t("send")}</button></form>`}

/* ---------- 签名画布逻辑 ---------- */
let cv=null,cx=null,drawn=false,pen=false;
function initCanvas(){
  cv=$("#sig");if(!cv)return;
  cx=cv.getContext("2d");
  cx.lineWidth=3.5;cx.lineCap=cx.lineJoin="round";cx.strokeStyle="#0b1f44";
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{pen=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pt(e))};
  cv.onpointermove=e=>{if(pen){cx.lineTo(...pt(e));cx.stroke();drawn=true;V.signed=true;const c=$("#f")&&$("#f").signed;if(c)c.checked=true}};
  cv.onpointerup=cv.onpointercancel=()=>{if(pen){pen=false;persistSig()}};
  const cached=sigLoad();
  if(cached){
    const i=new Image();
    i.onload=()=>{cx.drawImage(i,0,0);drawn=true;V.signed=true;
      const c=$("#f")&&$("#f").signed;if(c)c.checked=true;
      const h=$("#sigHint");if(h)h.textContent=t("sigRestored")+" · "+t("sigExpire")+" "+sigExpiryText(cached.ts);
      $("#paper")&&($("#paper").outerHTML=paper());lucide.createIcons();
    };
    i.src=cached.data;
  }
  $("#sigClr").onclick=()=>{
    cx.clearRect(0,0,cv.width,cv.height);
    drawn=false;V.signed=false;
    const c=$("#f")&&$("#f").signed;if(c)c.checked=false;
    sigClear();
    const h=$("#sigHint");if(h)h.textContent=t("sigSaved");
    $("#paper")&&($("#paper").outerHTML=paper());lucide.createIcons();
  };
}
function persistSig(){
  if(!cv||!drawn)return;
  try{
    const data=cv.toDataURL("image/png");
    sigSave(data);
    const h=$("#sigHint");if(h)h.textContent=t("sigSaved")+" · "+t("sigExpire")+" "+sigExpiryText(Date.now());
    $("#paper")&&($("#paper").outerHTML=paper());lucide.createIcons();
  }catch{}
}

function draw(){
  const a=$("#app");document.documentElement.lang=L;
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));
  if(state=="load")a.innerHTML="";
  else if(state=="nf")a.innerHTML=`<div class="msg e"><i data-lucide="file-x"></i><h2>${t("nf")}</h2><p>${t("nft")}</p></div>`;
  else if(state=="ok")a.innerHTML=`<div class="msg"><i data-lucide="check-circle-2"></i><h2>${t("ok")}</h2><p>${t("okt")}</p><button class="btn" id="again">${t("again")}</button></div>`;
  else{a.innerHTML=paper()+formHtml();bind();initCanvas()}
  lucide.createIcons();
  const b=$("#again");
  if(b)b.onclick=()=>{V={...V,student:"",kelas:"",icS:"",veh:null,signed:!!sigLoad()};state="form";draw();scrollTo(0,0)};
}

function bind(){
  const f=$("#f");
  f.oninput=f.onchange=e=>{
    const n=e.target.name,x=e.target;
    V[n]=n=="veh"?x.value=="1":n=="signed"?x.checked:x.value;
    if(n=="signed"&&x.checked&&!sigLoad()&&!(cv&&drawn)){V.signed=false;x.checked=false;return}
    const keep=document.activeElement;
    $("#paper").outerHTML=paper();
    lucide.createIcons();
    if(keep)keep.focus();
  };
  f.onsubmit=async e=>{
    e.preventDefault();
    const r=[V.parent,V.icP,V.student,V.kelas,V.icS,V.phone,V.date];
    if(r.some(x=>!String(x).trim())||V.veh===null){$("#err").textContent=t("req");return}
    if(!V.signed||(!sigLoad()&&!(cv&&drawn))){$("#err").textContent=t("sigNeed");return}
    const g=$("#go");g.disabled=true;g.textContent=t("sending");
    try{
      await addDoc(collection(db,"submissions"),{
        letterId:id,program:letter.program,
        parent:V.parent.trim(),icParent:V.icP.trim(),
        student:V.student.trim(),kelas:V.kelas,
        icStudent:V.icS.trim(),phone:V.phone.trim(),
        vehicle:V.veh,signed:V.signed,date:V.date,
        agreeEsign:true,
        createdAt:serverTimestamp()
      });
      state="ok";draw();scrollTo(0,0);
    }catch{
      $("#err").textContent=t("fail");g.disabled=false;g.textContent=t("send");
    }
  };
}

$("#lang").onclick=e=>{
  const l=e.target.dataset.l;
  if(l&&D[l]){L=l;localStorage.setItem("lang",l);
    const a=document.activeElement,n=a&&a.name;
    draw();
    if(n&&$("#f")){const el=$("#f")[n];el&&el.focus&&el.focus()}
  }
};

draw();
try{
  const s=id&&await getDoc(doc(db,"letters",id));
  if(s&&s.exists()){letter=s.data();state="form"}
  else state="nf";
}catch{state="nf"}
draw();
</script>
</body>
</html>
